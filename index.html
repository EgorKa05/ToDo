<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Список дел</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="todo-app">
    <h1>Список дел</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input
        id="task-input"
        type="text"
        placeholder="Введите задачу"
        maxlength="100"
        aria-label="Текст задачи"
      />

      <select id="priority-input" aria-label="Приоритет задачи">
        <option value="high">Высокий приоритет</option>
        <option value="medium" selected>Средний приоритет</option>
        <option value="low">Низкий приоритет</option>
      </select>

      <button type="submit">Добавить</button>
    </form>

    <p id="message" class="message" role="alert" aria-live="polite"></p>

    <section class="toolbar" aria-label="Управление списком">
      <div class="filters" role="group" aria-label="Фильтрация задач">
        <button type="button" class="filter-btn active" data-filter="all">Все</button>
        <button type="button" class="filter-btn" data-filter="active">Активные</button>
        <button type="button" class="filter-btn" data-filter="completed">Выполненные</button>
      </div>

      <div class="extra-filters" aria-label="Дополнительные фильтры">
        <input id="search-input" type="search" placeholder="Поиск по тексту..." aria-label="Поиск задач" />
        <select id="priority-filter" aria-label="Фильтр по приоритету">
          <option value="all" selected>Все приоритеты</option>
          <option value="high">Только высокий</option>
          <option value="medium">Только средний</option>
          <option value="low">Только низкий</option>
        </select>
        <select id="sort-mode" aria-label="Сортировка">
          <option value="created_desc" selected>Сначала новые</option>
          <option value="created_asc">Сначала старые</option>
          <option value="alpha_asc">А-Я</option>
          <option value="alpha_desc">Я-А</option>
        </select>
      </div>

      <p id="counter" class="counter">Осталось: 0</p>
      <button id="clear-completed" type="button" class="clear-btn">Очистить выполненные</button>
    </section>

    <ul id="todo-list" class="todo-list" aria-label="Список задач"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
